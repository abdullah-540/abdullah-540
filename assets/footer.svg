<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" role="img" aria-label="Let's build something that scales. Open to Solutions Architect, Senior Full-Stack and Cloud/Platform roles.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#0d1526"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#16213a" stroke-width="1"/></pattern>
  <radialGradient id="glowC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowV" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c084fc" stop-opacity=".22"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  
</defs>
<rect width="1200" height="180" rx="20" fill="url(#bg)"/>
<rect width="1200" height="180" rx="20" fill="url(#grid)" opacity=".6"/>
<rect x=".5" y=".5" width="1199" height="179" rx="20" fill="none" stroke="#1e2a44"/>
<circle cx="600" cy="200" r="320" fill="url(#glowV)"/>
<text x="600" y="78" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="0" >Let's build something that scales.</text>
<text x="600" y="112" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#8a9bb5" text-anchor="middle" letter-spacing="0" >Open to Solutions Architect, Senior Full-Stack and Cloud/Platform roles, and to consulting.</text>
<rect x="540" y="134" width="120" height="4" rx="2" fill="url(#acc)"/>
</svg>